# Copy to tds.yml in your project root, then run `tds serve`.
data_dir: ./data        # data + .auth/ (accounts, keys, secret) live here
storage: sqlite         # "sqlite" (default, one tds.db file) or "file" (JSON per namespace)
auth: true              # user accounts + per-namespace access control
host: 127.0.0.1
port: 8000
# db_path: ./data/tds.db   # override the SQLite file location (sqlite backend)
# secret: <set to pin session-cookie signing across restarts/instances>
