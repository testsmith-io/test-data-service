[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-data-service"
version = "0.3.0"
description = "A disk-backed test data service with a REST API and web interface"
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Roy de Kleijn", email = "dekleijn.roy@gmail.com" },
]
keywords = ["test-data", "rest", "api", "fastapi", "key-value", "testing", "mock-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
tds = "testdataservice.cli:main"

[project.urls]
Homepage = "https://github.com/testsmith-io/test-data-service"
Documentation = "https://github.com/testsmith-io/test-data-service#readme"
Repository = "https://github.com/testsmith-io/test-data-service"
Issues = "https://github.com/testsmith-io/test-data-service/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testdataservice = ["web/templates/*.html", "web/static/*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
